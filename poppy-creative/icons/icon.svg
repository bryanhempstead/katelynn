<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PoppyShuffle app icon: hand-sketched outline poppy with leaf sprigs,
       matching the line-drawn flower in The Poppy Creative's logo. -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <g fill="none" stroke="#2A2A26" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- five petals -->
    <path d="M256 210c-24-46-22-92 0-130 22 38 24 84 0 130Z"/>
    <path d="M300 232c50-14 95 0 124 30-41 14-88 5-124-30Z"/>
    <path d="M212 232c-50-14-95 0-124 30 41 14 88 5 124-30Z"/>
    <path d="M284 274c31 42 38 89 24 130-36-25-51-70-24-130Z"/>
    <path d="M228 274c-31 42-38 89-24 130 36-25 51-70 24-130Z"/>
    <!-- poppy center -->
    <circle cx="256" cy="242" r="34"/>
    <!-- leaf sprigs at the base -->
    <path d="M164 430c22-30 52-46 92-46-14 34-46 50-92 46Z"/>
    <path d="M348 430c-22-30-52-46-92-46 14 34 46 50 92 46Z"/>
  </g>
  <g fill="#2A2A26">
    <circle cx="256" cy="242" r="9"/>
    <circle cx="256" cy="222" r="5"/>
    <circle cx="275" cy="236" r="5"/>
    <circle cx="268" cy="258" r="5"/>
    <circle cx="244" cy="258" r="5"/>
    <circle cx="237" cy="236" r="5"/>
  </g>
</svg>
