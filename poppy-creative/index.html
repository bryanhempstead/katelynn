<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poppy Creative — Studio Manager</title>
<meta name="description" content="PoppyShuffle: open-source event & rental management for The Poppy Creative — inventory, quotes, contracts, invoices, calendar, and website integration.">
<meta name="theme-color" content="#DE1E7E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash"><div class="splash-mark"><img src="icons/icon.svg" alt="" width="72" height="72"></div><div class="splash-word">Poppy Creative</div></div>

<header class="topbar">
  <button id="menu-toggle" class="icon-btn" aria-label="Menu">☰</button>
  <a class="brand" href="#/dashboard">
    <span class="brand-mark"><img src="icons/icon.svg" alt="" width="30" height="30"></span>
    <span class="brand-text"><strong id="brand-name">The Poppy Creative</strong><small>Studio Manager</small></span>
  </a>
  <div class="topbar-spacer"></div>
  <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">◐</button>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Main">
    <div id="nav-links"></div>
    <div class="sidebar-foot">
      <a href="embed/catalog.html" target="_blank" rel="noopener" class="nav-link nav-ext">
        <span class="nav-icon"><span class="bicon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h17" opacity="0"/><path d="M3.5 15.5C7 9 12 8.5 20.5 9.5"/><path d="M8.3 11.9c-.5-1.8 0-3.4 1.2-4.6.5 1.8 0 3.4-1.2 4.6Z"/><path d="M13.6 9.9c-.5-1.8 0-3.4 1.2-4.6.5 1.8 0 3.4-1.2 4.6Z"/><path d="M11 12.3c.5 1.8 0 3.4-1.2 4.6-.5-1.8 0-3.4 1.2-4.6Z"/><path d="M16.4 10.5c.5 1.8 0 3.4-1.2 4.6-.5-1.8 0-3.4 1.2-4.6Z"/></svg></span></span><span class="nav-label">Public catalog</span></a>
      <div style="text-align:center;color:var(--muted);padding:.4rem 0 0">
        <svg viewBox="0 0 220 26" width="140" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 15C40 13 70 13 96 14M124 14c26-1 56-1 88 1"/><path d="M34 14c3-6 8-9 15-9-2 6-7 9-15 9Z"/><path d="M62 14c-3 6-8 9-15 9 2-6 7-9 15-9Z"/><path d="M158 14c3-6 8-9 15-9-2 6-7 9-15 9Z"/><path d="M186 14c-3 6-8 9-15 9 2-6 7-9 15-9Z"/><circle cx="110" cy="13" r="2"/><path d="M110 6.5c1 1.6 1 3 0 4.4-1-1.4-1-2.8 0-4.4Z"/><path d="M110 19.5c1-1.6 1-3 0-4.4-1 1.4-1 2.8 0 4.4Z"/><path d="M103.5 13c1.6-1 3-1 4.4 0-1.4 1-2.8 1-4.4 0Z"/><path d="M116.5 13c-1.6-1-3-1-4.4 0 1.4 1 2.8 1 4.4 0Z"/></svg>
      </div>
      <p class="foot-note">Open-source · offline-first<br>Works as web, desktop &amp; mobile app</p>
    </div>
  </nav>
  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
  <main id="view" class="main" tabindex="-1"></main>
</div>

<div id="toasts" aria-live="polite"></div>

<script type="module">
  import { startApp } from './js/app.js';
  import './js/views/dashboard.js';
  import './js/views/inventory.js';
  import './js/views/projects.js';
  import './js/views/clients.js';
  import './js/views/calendar.js';
  import './js/views/reports.js';
  import './js/views/settings.js';
  startApp();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
