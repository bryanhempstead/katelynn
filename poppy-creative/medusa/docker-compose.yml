# ============================================================================
# PoppyShuffle — self-hosted Medusa v2 stack (postgres + redis + medusa server)
# ============================================================================
#
# Medusa cannot run inside the static PoppyShuffle app — it is a Node server
# with a Postgres database. This compose file runs the whole stack on any
# Docker host (a $5–10 VPS is plenty). Full walkthrough: ../docs/MEDUSA.md
#
# IMPORTANT — two-step setup (there is no official all-in-one Medusa image):
#
#   1. Scaffold the Medusa app into ./app (one time, from this directory):
#        npx create-medusa-app@latest app
#      The wizard asks for a Postgres database; either point it at a local
#      Postgres, or start only this stack's database first and use it:
#        docker compose up -d postgres
#        npx create-medusa-app@latest app \
#          --db-url "postgres://medusa:CHANGE-ME-db-password@localhost:5432/medusa"
#
#   2. Replace every CHANGE-ME below (secrets + CORS origins), then:
#        docker compose up -d --build
#      The medusa service builds ./app via ./Dockerfile, migrates the
#      database, and serves the API + admin dashboard on port 9000:
#        API:   http://localhost:9000        Admin: http://localhost:9000/app
#      Create your first admin login:
#        docker compose exec medusa npx medusa user -e you@example.com -p <password>
#
# Secrets: generate strong values with  `openssl rand -hex 32`  — never ship
# the CHANGE-ME placeholders to a public host.

services:
  # --------------------------------------------------------------------------
  # postgres — Medusa's primary datastore (products, orders, customers, …).
  # Data persists in the named volume `pgdata` across restarts and upgrades.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: CHANGE-ME-db-password   # must match DATABASE_URL below
      POSTGRES_DB: medusa
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost ONLY so step 1 (create-medusa-app) and psql can
    # reach it from the host. Remove this mapping once setup is done if you
    # don't need host access.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # redis — Medusa's event bus / workflow engine / cache backend.
  # Safe to lose (it is not the source of truth), but persisting it avoids
  # re-running in-flight workflows after a restart.
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # medusa — the Medusa v2 server itself (Store API + Admin API + admin
  # dashboard). Built from the app you scaffolded into ./app (see header),
  # using ./Dockerfile: `medusa build` → run the .medusa/server bundle.
  # Migrations run automatically on every start (see Dockerfile CMD).
  # --------------------------------------------------------------------------
  medusa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"                              # http://<host>:9000 (put a TLS proxy in front for production)
    environment:
      NODE_ENV: production
      PORT: "9000"
      # Connection strings use the compose service names as hostnames.
      DATABASE_URL: postgres://medusa:CHANGE-ME-db-password@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      # Secrets for auth tokens and session cookies — generate with
      # `openssl rand -hex 32`. The server is insecure until these change.
      JWT_SECRET: CHANGE-ME-jwt-secret
      COOKIE_SECRET: CHANGE-ME-cookie-secret
      # CORS allow-lists (comma-separated origins).
      # STORE_CORS must include wherever PoppyShuffle is served from, or the
      # in-app adapter (js/medusa.js pullProducts) will be blocked by the
      # browser. ADMIN_CORS/AUTH_CORS cover the admin dashboard + auth routes.
      STORE_CORS: https://CHANGE-ME-your-poppyshuffle-host.example
      ADMIN_CORS: http://localhost:9000,https://CHANGE-ME-your-medusa-host.example
      AUTH_CORS: http://localhost:9000,https://CHANGE-ME-your-medusa-host.example
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s                          # first boot runs migrations

# Named volumes — `docker compose down` keeps them; `down -v` deletes them.
volumes:
  pgdata:
  redisdata:
