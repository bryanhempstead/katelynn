<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PoppyShuffle app icon: stylized five-petal poppy on a warm cream tile -->
  <rect width="512" height="512" rx="104" fill="#faf6ef"/>
  <g transform="translate(256 256)">
    <!-- five petals -->
    <g fill="#E4593B">
      <ellipse cy="-108" rx="80" ry="114"/>
      <ellipse cy="-108" rx="80" ry="114" transform="rotate(72)"/>
      <ellipse cy="-108" rx="80" ry="114" transform="rotate(144)"/>
      <ellipse cy="-108" rx="80" ry="114" transform="rotate(216)"/>
      <ellipse cy="-108" rx="80" ry="114" transform="rotate(288)"/>
    </g>
    <!-- stamen dots -->
    <g fill="#233329">
      <circle cy="-66" r="10"/>
      <circle cy="-66" r="10" transform="rotate(45)"/>
      <circle cy="-66" r="10" transform="rotate(90)"/>
      <circle cy="-66" r="10" transform="rotate(135)"/>
      <circle cy="-66" r="10" transform="rotate(180)"/>
      <circle cy="-66" r="10" transform="rotate(225)"/>
      <circle cy="-66" r="10" transform="rotate(270)"/>
      <circle cy="-66" r="10" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle r="42" fill="#233329"/>
  </g>
</svg>
